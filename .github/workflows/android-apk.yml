name: Android APK

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: pnpm install --frozen-lockfile

      - name: Generate Android project
        working-directory: app
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: app/android
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: yogganga-release-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish nightly release
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/apk/release/app-release.apk yogganga-nightly.apk
          title="Yogganga nightly $(date -u +%Y-%m-%d)"
          notes="Built from main at $(date -u '+%Y-%m-%d %H:%M UTC') (${GITHUB_SHA:0:7})."
          if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit nightly --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"
          else
            gh release create nightly --repo "$GITHUB_REPOSITORY" --prerelease --title "$title" --notes "$notes"
          fi
          gh release upload nightly yogganga-nightly.apk --repo "$GITHUB_REPOSITORY" --clobber
