name: Android APK

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: pnpm install --frozen-lockfile

      # Gradle can only skip the native compile if the old outputs are on disk.
      - name: Restore native build cache
        uses: actions/cache@v4
        with:
          path: |
            app/android
            node_modules/**/build
            node_modules/**/.cxx
            node_modules/**/.gradle
          key: android-native-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', '.npmrc', 'app/package.json', 'app/app.json', '.github/workflows/android-apk.yml') }}

      - name: Generate Android project
        working-directory: app
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: app/android
        # arm64 only: the other ABIs were ~3/4 of the native compile time.
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --build-cache

      - uses: actions/upload-artifact@v4
        with:
          name: yogganga-release-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/apk/release/app-release.apk yogganga-nightly.apk
          title="Yogganga nightly $(date -u +%Y-%m-%d)"
          notes="Built from main at $(date -u '+%Y-%m-%d %H:%M UTC') (${GITHUB_SHA:0:7})."
          # Prereleases are excluded from the repo sidebar, so the nightly must be a normal release.
          if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit nightly --repo "$GITHUB_REPOSITORY" --prerelease=false --title "$title" --notes "$notes"
          else
            gh release create nightly --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"
          fi
          gh release upload nightly yogganga-nightly.apk --repo "$GITHUB_REPOSITORY" --clobber
