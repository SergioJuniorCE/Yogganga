name: yogganga

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: yogganga-server:local
    container_name: yogganga
    restart: unless-stopped
    ports:
      # The container always listens on 8787 (keep PORT=8787 in server/.env).
      - "8787:8787"
    env_file:
      - ./server/.env
    volumes:
      # Keep the existing database and downloaded chapters on the host.
      - ./server/data:/app/server/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
